PageInfo:
  type: object
  required:
    - nextCursor
    - hasNextPage
  properties:
    nextCursor:
      type:
        - string
        - "null"
    hasNextPage:
      type: boolean
ErrorDetail:
  type: object
  required:
    - code
    - message
    - requestId
  properties:
    code:
      type: string
    message:
      type: string
    fields:
      type: object
      additionalProperties:
        type: string
    requestId:
      type: string
ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      $ref: "#/components/schemas/ErrorDetail"
