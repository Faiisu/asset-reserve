/auth/google/login:
  get:
    tags:
      - Account Linking
    summary: Sign in with an already-linked Google account
    description: >-
      Public, unauthenticated. Redirects to Google's consent screen. On return, the callback
      only succeeds if this Google identity is already linked to a user via `/auth/google/connect`
      -- there is no auto-provisioning by email. An identity with no link is redirected back to
      the frontend login page with `?googleError=not_linked`.
    operationId: googleLogin
    security: []
    responses:
      "302":
        description: Redirect to Google's OAuth consent screen.
        headers:
          Location:
            description: Google authorization URL.
            schema:
              type: string
      "503":
        description: Google sign-in is not configured for this deployment.
/auth/google/connect:
  get:
    tags:
      - Account Linking
    summary: Start linking a Google account to the signed-in user
    description: >-
      Authenticated. The only way a Google identity ever becomes linked. Returns the
      authorization URL as JSON (rather than redirecting directly) because this route requires
      a Bearer token, which a plain link navigation can't send -- the frontend fetches this
      first, then navigates the browser to the returned `url` itself.
    operationId: googleConnect
    responses:
      "200":
        description: Authorization URL to navigate to.
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
      "401":
        $ref: "#/components/responses/Unauthorized"
      "503":
        description: Google sign-in is not configured for this deployment.
/auth/google/callback:
  get:
    tags:
      - Account Linking
    summary: Google OAuth callback (login or connect, discriminated by signed state)
    description: >-
      Public. Never called directly by a client -- Google redirects here after consent. Always
      ends in a 302 back to the frontend: `/auth/callback?token=...` on successful login,
      `/connect-account/callback?ok=1` on successful link, or `/login`/`/connect-account` with an
      `?googleError=...` query param on failure.
    operationId: googleCallback
    security: []
    parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
    responses:
      "302":
        description: Redirect back to the frontend.
        headers:
          Location:
            schema:
              type: string
/auth/microsoft/login:
  get:
    tags:
      - Account Linking
    summary: Sign in with an already-linked Microsoft account
    description: Mirrors `/auth/google/login` exactly, against Microsoft/Entra ID instead of Google.
    operationId: microsoftLogin
    security: []
    responses:
