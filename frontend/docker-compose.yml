name: asset-reservation-frontend

services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-asset-reservation-network}

