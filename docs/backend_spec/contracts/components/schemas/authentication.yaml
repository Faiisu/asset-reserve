Profile:
  type: object
  required:
    - name
    - phoneNumber
    - profilePictureUrl
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    phoneNumber:
      type:
        - string
        - "null"
      maxLength: 30
    profilePictureUrl:
      type:
        - string
        - "null"
      format: uri
      maxLength: 2048
UserIdentity:
  type: object
  required:
    - id
    - username
    - email
    - isActive
    - profile
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
      description: The login identifier. Immutable format `^[a-z0-9._-]{3,50}$`, set at creation.
      maxLength: 50
    email:
      type:
        - string
        - "null"
      format: email
      maxLength: 255
      description: Null until the user links a Google or Microsoft account; never settable directly at creation.
    isActive:
      type: boolean
    profile:
      oneOf:
        - $ref: "#/components/schemas/Profile"
        - type: "null"
SessionRole:
  type: object
  required:
    - assignmentId
    - id
    - name
    - permissions
    - managementArea
  properties:
    assignmentId:
      type: string
      format: uuid
    id:
      type: string
      format: uuid
    name:
      $ref: "#/components/schemas/RoleName"
    permissions:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/PermissionKey"
    managementArea:
      oneOf:
        - $ref: "#/components/schemas/ManagementAreaRef"
        - type: "null"
AreaPermissions:
  type: object
  required:
    - managementAreaId
    - permissions
  properties:
    managementAreaId:
      type: string
      format: uuid
    permissions:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/PermissionKey"
EffectivePermissions:
  type: object
  required:
    - global
    - byManagementArea
  properties:
    global:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/PermissionKey"
    byManagementArea:
      type: array
      items:
        $ref: "#/components/schemas/AreaPermissions"
SessionUser:
  description: UserIdentity plus the account-linking state, which only ever applies to the caller's own session actor (not to other users viewed via UserDetail).
  allOf:
    - $ref: "#/components/schemas/UserIdentity"
    - type: object
      required:
        - linkedProviders
        - accountLinkRequired
      properties:
        linkedProviders:
          type: array
          description: External providers with a linked identity for this user, e.g. `["google"]`. Empty if none linked yet.
          items:
            type: string
            enum: [google, microsoft]
        accountLinkRequired:
          type: boolean
          description: Whether this deployment currently hard-gates unlinked users at `/connect-account` (derived from `REQUIRE_ACCOUNT_LINK` and whether any provider is configured). See [`oauth-setup.md`](../../../integrations/oauth-setup.md).
SessionContext:
  type: object
  required:
    - user
    - roles
    - effectivePermissions
  properties:
    user:
      $ref: "#/components/schemas/SessionUser"
    roles:
      type: array
      items:
        $ref: "#/components/schemas/SessionRole"
    effectivePermissions:
      $ref: "#/components/schemas/EffectivePermissions"
LoginRequest:
  type: object
  additionalProperties: false
  required:
    - username
    - password
  properties:
    username:
      type: string
      description: Trimmed and lowercased before lookup. Not an email address — see `UserIdentity.username`.
      minLength: 1
      maxLength: 50
    password:
      type: string
      minLength: 1
      maxLength: 1024
      writeOnly: true
LoginResponse:
  type: object
  required:
    - accessToken
    - tokenType
    - expiresIn
    - session
  properties:
    accessToken:
      type: string
    tokenType:
      type: string
      const: Bearer
    expiresIn:
      type: integer
      minimum: 1
      example: 900
    session:
      $ref: "#/components/schemas/SessionContext"
