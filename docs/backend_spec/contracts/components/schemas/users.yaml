UserListItem:
  type: object
  required:
    - id
    - username
    - email
    - name
    - isActive
    - roleCount
    - roles
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
      maxLength: 50
    email:
      type:
        - string
        - "null"
      format: email
      description: Null until the user links a Google or Microsoft account.
    name:
      type:
        - string
        - "null"
    isActive:
      type: boolean
    roleCount:
      type: integer
      minimum: 0
    roles:
      type: array
      description: Distinct roles assigned to the user across global and management-area scopes.
      items:
        $ref: "#/components/schemas/RoleRef"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
UserListResponse:
  type: object
  required:
    - data
    - pageInfo
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/UserListItem"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
UserDirectoryEntry:
  type: object
  description: >-
    Minimal identity used to pick reservation participants. Deliberately
    narrower than UserListItem -- no username, roles, or timestamps.
  required:
    - id
    - email
    - name
    - profilePictureUrl
  properties:
    id:
      type: string
      format: uuid
    email:
      type: [string, "null"]
      format: email
    name:
      type: [string, "null"]
    profilePictureUrl:
      type: [string, "null"]
      format: uri
UserDirectoryResponse:
  type: object
  required:
    - data
    - pageInfo
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/UserDirectoryEntry"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
ActorRef:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
    name:
      type:
        - string
        - "null"
RoleRef:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
    name:
      $ref: "#/components/schemas/RoleName"
RoleAssignment:
  type: object
  required:
    - id
    - userId
    - role
    - managementArea
    - assignedBy
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    role:
      $ref: "#/components/schemas/RoleRef"
    managementArea:
      oneOf:
        - $ref: "#/components/schemas/ManagementAreaRef"
        - type: "null"
    assignedBy:
      oneOf:
        - $ref: "#/components/schemas/ActorRef"
        - type: "null"
    createdAt:
      type: string
      format: date-time
UserDetail:
  allOf:
    - $ref: "#/components/schemas/UserIdentity"
    - type: object
      required:
        - authProviders
        - roleAssignments
        - createdAt
        - updatedAt
      properties:
        authProviders:
          type: array
          uniqueItems: true
          items:
            type: string
        roleAssignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
CreateUserRequest:
  type: object
  additionalProperties: false
  required:
    - username
    - password
  properties:
    username:
      type: string
      description: >-
        Login identifier only -- no email or profile required up front. Trimmed and lowercased
        before validation. Must match `^[a-z0-9._-]{3,50}$`.
      pattern: "^[a-z0-9._-]{3,50}$"
      minLength: 3
      maxLength: 50
    password:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true
UpdateUserStatusRequest:
  type: object
  additionalProperties: false
  required:
    - isActive
    - expectedUpdatedAt
  properties:
    isActive:
      type: boolean
    expectedUpdatedAt:
      type: string
      format: date-time
AssignRoleRequest:
  type: object
  additionalProperties: false
  required:
    - roleId
    - managementAreaId
  properties:
    roleId:
      type: string
      format: uuid
    managementAreaId:
      type:
        - string
        - "null"
      format: uuid
UpdateSelfRequest:
  type: object
  additionalProperties: false
  description: >-
    Self-service profile edit, distinct from admin-only POST/PATCH user-management endpoints.
    Both fields optional and independent so a user can update just their notification email
    without also touching their name, or vice versa.
  properties:
    name:
      type: string
      maxLength: 150
    email:
      type: string
      format: email
      maxLength: 255
      description: Trimmed and lowercased before validation. Rejected with 409 EMAIL_ALREADY_IN_USE if another user already holds it.
ChangeMyPasswordRequest:
  type: object
  additionalProperties: false
  required:
    - currentPassword
    - newPassword
  properties:
    currentPassword:
      type: string
      minLength: 1
      maxLength: 1024
      writeOnly: true
    newPassword:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true
