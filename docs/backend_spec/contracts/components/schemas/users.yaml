UserListItem:
  type: object
  required:
    - id
    - email
    - name
    - isActive
    - roleCount
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type:
        - string
        - "null"
    isActive:
      type: boolean
    roleCount:
      type: integer
      minimum: 0
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
UserListResponse:
  type: object
  required:
    - data
    - pageInfo
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/UserListItem"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
ActorRef:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
    name:
      type:
        - string
        - "null"
RoleRef:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
    name:
      $ref: "#/components/schemas/RoleName"
RoleAssignment:
  type: object
  required:
    - id
    - userId
    - role
    - managementArea
    - assignedBy
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    role:
      $ref: "#/components/schemas/RoleRef"
    managementArea:
      oneOf:
        - $ref: "#/components/schemas/ManagementAreaRef"
        - type: "null"
    assignedBy:
      oneOf:
        - $ref: "#/components/schemas/ActorRef"
        - type: "null"
    createdAt:
      type: string
      format: date-time
UserDetail:
  allOf:
    - $ref: "#/components/schemas/UserIdentity"
    - type: object
      required:
        - authProviders
        - roleAssignments
        - createdAt
        - updatedAt
      properties:
        authProviders:
          type: array
          uniqueItems: true
          items:
            type: string
        roleAssignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
CreateProfileInput:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    phoneNumber:
      type:
        - string
        - "null"
      maxLength: 30
    profilePictureUrl:
      type:
        - string
        - "null"
      format: uri
      maxLength: 2048
CreateUserRequest:
  type: object
  additionalProperties: false
  required:
    - email
    - password
    - profile
  properties:
    email:
      type: string
      format: email
      maxLength: 255
    password:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
    profile:
      $ref: "#/components/schemas/CreateProfileInput"
UpdateUserStatusRequest:
  type: object
  additionalProperties: false
  required:
    - isActive
    - expectedUpdatedAt
  properties:
    isActive:
      type: boolean
    expectedUpdatedAt:
      type: string
      format: date-time
AssignRoleRequest:
  type: object
  additionalProperties: false
  required:
    - roleId
    - managementAreaId
  properties:
    roleId:
      type: string
      format: uuid
    managementAreaId:
      type:
        - string
        - "null"
      format: uuid
