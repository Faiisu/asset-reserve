ReservationStatus:
  type: string
  enum:
    - DRAFT
    - PENDING_APPROVAL
    - PARTIALLY_APPROVED
    - APPROVED
    - DELIVERY_CONFIRMED
    - RETURN_PENDING
    - RETURN_CONFIRMED
    - COMPLETED
    - REJECTED
    - CANCELLED
ReservationItemStatus:
  type: string
  enum:
    - PENDING
    - APPROVED
    - REJECTED
    - PREPARED
    - DELIVERED
    - RETURNED
ReservationItemInput:
  type: object
  additionalProperties: false
  required:
    - assetId
    - quantity
  properties:
    assetId:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 2147483647
ReservationSummary:
  type: object
  required:
    - id
    - eventName
    - description
    - startAt
    - endAt
    - status
    - requester
    - managementAreas
    - itemCount
    - totalQuantity
    - pendingItemCount
    - approvedItemCount
    - rejectedItemCount
    - hasPendingChangeRequest
    - pendingDecisionCount
    - capabilities
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    eventName:
      type: string
    description:
      type: [string, "null"]
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
    status:
      $ref: "#/components/schemas/ReservationStatus"
    requester:
      $ref: "#/components/schemas/ReservationUser"
    managementAreas:
      type: array
      items:
        $ref: "#/components/schemas/ManagementAreaRef"
    itemCount:
      type: integer
      minimum: 1
    totalQuantity:
      type: integer
      minimum: 1
    pendingItemCount:
      type: integer
      minimum: 0
    approvedItemCount:
      type: integer
      minimum: 0
    rejectedItemCount:
      type: integer
      minimum: 0
    hasPendingChangeRequest:
      type: boolean
    pendingDecisionCount:
      type: integer
      minimum: 0
    capabilities:
      type: object
      required: [canSubmit, canRequestChange, canReview]
      properties:
        canSubmit:
          type: boolean
        canRequestChange:
          type: boolean
        canReview:
          type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ReservationListResponse:
  type: object
  required: [data, pageInfo]
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/ReservationSummary"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
CreateReservationRequest:
  type: object
  additionalProperties: false
  required:
    - eventName
    - startAt
    - endAt
  properties:
    eventName:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
    status:
      type: string
      enum:
        - DRAFT
        - PENDING_APPROVAL
      default: DRAFT
    items:
      type: array
      maxItems: 100
      description: Optional. If empty or omitted, the reservation is automatically approved.
      items:
        $ref: "#/components/schemas/ReservationItemInput"
    participantIds:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        format: uuid
SubmitReservationRequest:
  type: object
  additionalProperties: false
  required:
    - expectedUpdatedAt
  properties:
    expectedUpdatedAt:
      type: string
      format: date-time
ReservationItemDecisionRequest:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - APPROVE
        - REJECT
    comment:
      type: string
      maxLength: 2000
ReservationItemsDecisionRequest:
  type: object
  additionalProperties: false
  required:
    - itemIds
    - decision
  properties:
    itemIds:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        format: uuid
    decision:
      type: string
      enum:
        - APPROVE
        - REJECT
    comment:
      type: string
      maxLength: 2000
ReservationChangeData:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    eventName:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
    items:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/components/schemas/ReservationItemInput"
    participantIds:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        format: uuid
CreateReservationChangeRequest:
  type: object
  additionalProperties: false
  required:
    - changeData
  properties:
    changeData:
      $ref: "#/components/schemas/ReservationChangeData"
    reason:
      type: string
      maxLength: 2000
ReservationChangeRequestDecisionRequest:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - APPROVE
        - REJECT
ReservationUser:
  type: object
  required:
    - id
    - email
    - name
    - profilePictureUrl
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type:
        - string
        - "null"
    profilePictureUrl:
      type:
        - string
        - "null"
      format: uri
ReservationAsset:
  type: object
  required:
    - id
    - name
    - isActive
    - managementArea
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type:
        - string
        - "null"
    pictureUrl:
      type:
        - string
        - "null"
      format: uri
    isActive:
      type: boolean
    managementArea:
      $ref: "#/components/schemas/ManagementAreaRef"
ReservationAvailability:
  type: object
  required:
    - assetId
    - totalQuantity
    - approvedQuantity
    - pendingQuantity
    - availableQuantity
    - pendingReservationCount
  properties:
    assetId:
      type: string
      format: uuid
    totalQuantity:
      type: integer
    approvedQuantity:
      type: integer
      description: Quantity approved by other overlapping reservations.
    pendingQuantity:
      type: integer
      description: Quantity requested by other overlapping unapproved reservations.
    availableQuantity:
      type: integer
    pendingReservationCount:
      type: integer
ReservationWarning:
  type: object
  required:
    - code
    - message
    - pendingQuantity
    - pendingReservationCount
  properties:
    code:
      type: string
      const: PENDING_RESERVATION_OVERLAP
    message:
      type: string
    pendingQuantity:
      type: integer
    pendingReservationCount:
      type: integer
ReservationApproval:
  type:
    - object
    - "null"
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    comment:
      type:
        - string
        - "null"
    decidedAt:
      type:
        - string
        - "null"
      format: date-time
    approver:
      $ref: "#/components/schemas/ReservationUser"
ReservationDetailItem:
  type: object
  required:
    - id
    - quantity
    - status
    - asset
    - approval
    - availability
    - warnings
    - capabilities
  properties:
    id:
      type: string
      format: uuid
    quantity:
      type: integer
    status:
      $ref: "#/components/schemas/ReservationItemStatus"
    asset:
      $ref: "#/components/schemas/ReservationAsset"
    approval:
      $ref: "#/components/schemas/ReservationApproval"
    availability:
      $ref: "#/components/schemas/ReservationAvailability"
    warnings:
      type: array
      items:
        $ref: "#/components/schemas/ReservationWarning"
    capabilities:
      type: object
      required:
        - canApprove
        - canReject
      properties:
        canApprove:
          type: boolean
        canReject:
          type: boolean
ReservationChangeRequest:
  type: object
  required:
    - id
    - changeData
    - status
    - requestedBy
    - reviewedBy
    - reviewedAt
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    changeData:
      $ref: "#/components/schemas/ReservationChangeData"
    reason:
      type:
        - string
        - "null"
    status:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - CANCELLED
    requestedBy:
      $ref: "#/components/schemas/ReservationUser"
    reviewedBy:
      oneOf:
        - $ref: "#/components/schemas/ReservationUser"
        - type: "null"
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
CancelReservationRequest:
  type: object
  additionalProperties: false
  properties:
    reason:
      type: string
      maxLength: 2000
ReservationDetail:
  type: object
  required:
    - id
    - eventName
    - startAt
    - endAt
    - status
    - requester
    - participants
    - items
    - changeRequests
    - returns
    - capabilities
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    eventName:
      type: string
    description:
      type:
        - string
        - "null"
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
    status:
      $ref: "#/components/schemas/ReservationStatus"
    requester:
      $ref: "#/components/schemas/ReservationUser"
    participants:
      type: array
      items:
        $ref: "#/components/schemas/ReservationUser"
    items:
      type: array
      items:
        $ref: "#/components/schemas/ReservationDetailItem"
    changeRequests:
      type: array
      items:
        $ref: "#/components/schemas/ReservationChangeRequest"
    returns:
      type: array
      items:
        $ref: "#/components/schemas/ReturnDetail"
    capabilities:
      type: object
      required:
        - canSubmit
        - canRequestChange
        - canConfirmDelivery
        - canReturn
        - canDecideReturn
      properties:
        canSubmit:
          type: boolean
        canRequestChange:
          type: boolean
        canConfirmDelivery:
          type: boolean
          description: >-
            True when actor is warehouse staff/Area Manager and the reservation is APPROVED
            or PARTIALLY_APPROVED with at least one approved item (§7.11 preconditions).
        canReturn:
          type: boolean
          description: >-
            True when actor is the requester/a participant and at least one
            ReservationItemUnit on this reservation is CHECKED_OUT (§8.2 preconditions).
        canDecideReturn:
          type: boolean
          description: >-
            True when actor is the Area Manager of the reservation's management area and
            at least one Return on this reservation is PENDING (§8.3 preconditions).
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
PrepareReservationItemRequest:
  type: object
  additionalProperties: false
  required:
    - assetUnitIds
  properties:
    assetUnitIds:
      type: array
      description: >-
        Exact serial units to assign to this item -- must match the item's approved quantity.
        Each unit must belong to the item's asset and currently be ACTIVE; assigning moves it
        to RESERVED.
      minItems: 1
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        format: uuid
ConfirmDeliveryRequest:
  type: object
  additionalProperties: false
  properties:
    itemIds:
      type: array
      items:
        type: string
        format: uuid
ReturnItemInput:
  type: object
  additionalProperties: false
  required:
    - reservationItemId
    - reservationItemUnitIds
  properties:
    reservationItemId:
      type: string
      format: uuid
    reservationItemUnitIds:
      type: array
      description: >-
        Checked-out reservation_item_unit IDs being dropped off for this item.
        Each unit must currently be CHECKED_OUT on this item.
      minItems: 1
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        format: uuid
    description:
      type: string
      maxLength: 2000
      nullable: true
CreateReturnRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/ReturnItemInput"
    note:
      type: string
      maxLength: 2000
      nullable: true
    immediateApprove:
      type: boolean
ReturnDecisionItemInput:
  type: object
  additionalProperties: false
  required:
    - reservationItemUnitId
    - condition
  properties:
    reservationItemUnitId:
      type: string
      format: uuid
    condition:
      type: string
      description: Per-unit inspection outcome. Required for every unit in the slip when decision is APPROVE.
      enum: [GOOD, BROKEN, LOST]
    description:
      type: string
      maxLength: 2000
      nullable: true
ReturnDecisionRequest:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum: [APPROVE, REJECT]
    items:
      type: array
      items:
        $ref: "#/components/schemas/ReturnDecisionItemInput"
    description:
      type: string
      maxLength: 2000
      nullable: true
ReturnItemUnitDetail:
  type: object
  required:
    - id
    - returnItemId
    - reservationItemUnitId
    - assetUnitId
    - serialNumber
    - condition
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    returnItemId:
      type: string
      format: uuid
    reservationItemUnitId:
      type: string
      format: uuid
    assetUnitId:
      type: string
      format: uuid
    serialNumber:
      type: string
    condition:
      type: string
      description: NULL until inspected and decided at return-approval time.
      enum: [GOOD, BROKEN, LOST]
      nullable: true
    pictureUrl:
      type: string
      nullable: true
    note:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
ReturnItemDetail:
  type: object
  required:
    - id
    - returnId
    - reservationItemId
    - units
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    returnId:
      type: string
      format: uuid
    reservationItemId:
      type: string
      format: uuid
    description:
      type: string
      nullable: true
    pictureUrl:
      type: string
      nullable: true
    units:
      type: array
      items:
        $ref: "#/components/schemas/ReturnItemUnitDetail"
    createdAt:
      type: string
      format: date-time
    reservationItem:
      $ref: "#/components/schemas/ReservationDetailItem"
ReturnApprovalDetail:
  type: object
  required:
    - id
    - returnId
    - approverId
    - status
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    returnId:
      type: string
      format: uuid
    approverId:
      type: string
      format: uuid
    status:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    description:
      type: string
      nullable: true
    decidedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    approver:
      $ref: "#/components/schemas/ReservationUser"
ReturnDetail:
  type: object
  required:
    - id
    - reservationId
    - returnedBy
    - status
    - items
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    reservationId:
      type: string
      format: uuid
    returnedBy:
      type: string
      format: uuid
    status:
      type: string
      enum: [PENDING, APPROVED, REJECTED, COMPLETED]
    returnedAt:
      type: string
      format: date-time
      nullable: true
    returner:
      $ref: "#/components/schemas/ReservationUser"
    items:
      type: array
      items:
        $ref: "#/components/schemas/ReturnItemDetail"
    approval:
      $ref: "#/components/schemas/ReturnApprovalDetail"
    reservation:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ReturnListResponse:
  type: object
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/ReturnDetail"
    pagination:
      $ref: "#/components/schemas/PageInfo"

