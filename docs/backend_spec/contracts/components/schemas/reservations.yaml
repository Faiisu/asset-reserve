ReservationStatus:
  type: string
  enum:
    - DRAFT
    - PENDING_APPROVAL
    - PARTIALLY_APPROVED
    - APPROVED
    - DELIVERY_CONFIRMED
    - RETURN_PENDING
    - RETURN_CONFIRMED
    - COMPLETED
    - REJECTED
    - CANCELLED
ReservationItemStatus:
  type: string
  description: >-
    APPROVE decisions assign serial units in the same request (§7.5) and go straight to
    PREPARED -- there is no separate APPROVED resting state.
  enum:
    - PENDING
    - REJECTED
    - PREPARED
    - DELIVERED
    - RETURNED
ReservationItemInput:
  type: object
  additionalProperties: false
  required:
    - assetId
    - quantity
  properties:
    assetId:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 2147483647
ReservationSummary:
  type: object
  required:
    - id
    - eventName
    - description
    - startAt
    - endAt
    - status
    - requester
    - managementAreas
    - itemCount
    - totalQuantity
    - pendingItemCount
    - approvedItemCount
    - rejectedItemCount
    - pendingDecisionCount
    - capabilities
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    eventName:
      type: string
    description:
      type: [string, "null"]
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
    status:
      $ref: "#/components/schemas/ReservationStatus"
    requester:
      $ref: "#/components/schemas/ReservationUser"
    managementAreas:
      type: array
      items:
        $ref: "#/components/schemas/ManagementAreaRef"
    itemCount:
      type: integer
      minimum: 1
    totalQuantity:
      type: integer
      minimum: 1
    pendingItemCount:
      type: integer
      minimum: 0
    approvedItemCount:
      type: integer
      minimum: 0
    rejectedItemCount:
      type: integer
      minimum: 0
    pendingDecisionCount:
      type: integer
      minimum: 0
    capabilities:
      type: object
      required: [canSubmit, canReview]
      properties:
        canSubmit:
          type: boolean
        canReview:
          type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ReservationListResponse:
  type: object
  required: [data, pageInfo]
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/ReservationSummary"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
CreateReservationRequest:
  type: object
  additionalProperties: false
  required:
    - eventName
    - startAt
    - endAt
  properties:
    eventName:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
    status:
      type: string
      enum:
        - DRAFT
        - PENDING_APPROVAL
      default: DRAFT
    items:
      type: array
      maxItems: 100
      description: Optional. If empty or omitted, the reservation is automatically approved.
      items:
        $ref: "#/components/schemas/ReservationItemInput"
    participantIds:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        format: uuid
SubmitReservationRequest:
  type: object
  additionalProperties: false
  required:
    - expectedUpdatedAt
  properties:
    expectedUpdatedAt:
      type: string
      format: date-time
ReservationItemDecisionRequest:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - APPROVE
        - REJECT
    assetUnitIds:
      type: array
      description: >-
        Required when decision is APPROVE (§7.5) -- serial-numbered units to assign to this
        item, all ACTIVE and belonging to the item's asset. Approval is unit-based: 1 to the
        item's quantity may be selected (fewer than requested is a valid partial approval --
        the item's quantity is cut down to match how many were actually approved). Not used,
        and must be omitted, when decision is REJECT -- reject is always whole-item, there is
        no unit-level reject. Approving without a separate "prepare" step assigns these units
        in the same request.
      minItems: 1
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        format: uuid
    comment:
      type: string
      maxLength: 2000
ReservationItemDecisionEntry:
  type: object
  additionalProperties: false
  required:
    - reservationItemId
  properties:
    reservationItemId:
      type: string
      format: uuid
    assetUnitIds:
      type: array
      description: Same rule as ReservationItemDecisionRequest.assetUnitIds -- unit-based, 1 to the item's quantity, required per item when the batch decision is APPROVE.
      minItems: 1
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        format: uuid
ReservationItemsDecisionRequest:
  type: object
  additionalProperties: false
  required:
    - items
    - decision
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/components/schemas/ReservationItemDecisionEntry"
    decision:
      type: string
      enum:
        - APPROVE
        - REJECT
    comment:
      type: string
      maxLength: 2000
ReservationUser:
  type: object
  required:
    - id
    - email
    - name
    - profilePictureUrl
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type:
        - string
        - "null"
    profilePictureUrl:
      type:
        - string
        - "null"
      format: uri
ReservationAsset:
  type: object
  required:
    - id
    - name
    - isActive
    - managementArea
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type:
        - string
        - "null"
    pictureUrl:
      type:
        - string
        - "null"
      format: uri
    isActive:
      type: boolean
    managementArea:
      $ref: "#/components/schemas/ManagementAreaRef"
ReservationAvailability:
  type: object
  required:
    - assetId
    - totalQuantity
    - approvedQuantity
    - pendingQuantity
    - availableQuantity
    - pendingReservationCount
  properties:
    assetId:
      type: string
      format: uuid
    totalQuantity:
      type: integer
    approvedQuantity:
      type: integer
      description: Quantity approved by other overlapping reservations.
    pendingQuantity:
      type: integer
      description: Quantity requested by other overlapping unapproved reservations.
    availableQuantity:
      type: integer
    pendingReservationCount:
      type: integer
ReservationWarning:
  type: object
  required:
    - code
    - message
    - pendingQuantity
    - pendingReservationCount
  properties:
    code:
      type: string
      const: PENDING_RESERVATION_OVERLAP
    message:
      type: string
    pendingQuantity:
      type: integer
    pendingReservationCount:
      type: integer
ReservationApproval:
  type:
    - object
    - "null"
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    comment:
      type:
        - string
        - "null"
    decidedAt:
      type:
        - string
        - "null"
      format: date-time
    approver:
      $ref: "#/components/schemas/ReservationUser"
ReservationDetailItem:
  type: object
  required:
    - id
    - quantity
    - status
    - asset
    - approval
    - availability
    - warnings
    - capabilities
  properties:
    id:
      type: string
      format: uuid
    quantity:
      type: integer
    status:
      $ref: "#/components/schemas/ReservationItemStatus"
    asset:
      $ref: "#/components/schemas/ReservationAsset"
    approval:
      $ref: "#/components/schemas/ReservationApproval"
    availability:
      $ref: "#/components/schemas/ReservationAvailability"
    warnings:
      type: array
      items:
        $ref: "#/components/schemas/ReservationWarning"
    units:
      type: array
      description: Serial-numbered units assigned to this item once it reaches PREPARED (assigned during item approval, §7.5).
      items:
        type: object
        required: [id, assetUnitId, serialNumber, status]
        properties:
          id:
            type: string
            format: uuid
          assetUnitId:
            type: string
            format: uuid
          serialNumber:
            type: string
          status:
            type: string
    returnSummary:
      type: object
      description: Per-item return progress, present once at least one unit has been checked out.
      properties:
        totalUnits:
          type: integer
        returnedGoodCount:
          type: integer
        returnedBrokenCount:
          type: integer
        returnedLostCount:
          type: integer
        pendingReturnCount:
          type: integer
        remainingReturnQuantity:
          type: integer
    capabilities:
      type: object
      required:
        - canApprove
        - canReject
      properties:
        canApprove:
          type: boolean
        canReject:
          type: boolean
        canConfirmDelivery:
          type: boolean
        canReturn:
          type: boolean
CancelReservationRequest:
  type: object
  additionalProperties: false
  properties:
    reason:
      type: string
      maxLength: 2000
ReservationDetail:
  type: object
  required:
    - id
    - eventName
    - startAt
    - endAt
    - status
    - requester
    - participants
    - items
    - returns
    - capabilities
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    eventName:
      type: string
    description:
      type:
        - string
        - "null"
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
    status:
      $ref: "#/components/schemas/ReservationStatus"
    requester:
      $ref: "#/components/schemas/ReservationUser"
    participants:
      type: array
      items:
        $ref: "#/components/schemas/ReservationUser"
    items:
      type: array
      items:
        $ref: "#/components/schemas/ReservationDetailItem"
    returns:
      type: array
      items:
        $ref: "#/components/schemas/ReturnDetail"
    capabilities:
      type: object
      required:
        - canSubmit
        - canConfirmDelivery
        - canReturn
        - canDecideReturn
      properties:
        canSubmit:
          type: boolean
        canConfirmDelivery:
          type: boolean
          description: >-
            True when actor is warehouse staff/Area Manager and the reservation is APPROVED
            or PARTIALLY_APPROVED with at least one item in PREPARED status (§7.11 preconditions).
        canReturn:
          type: boolean
          description: >-
            True when actor is the requester/a participant and at least one
            ReservationItemUnit on this reservation is CHECKED_OUT (§8.2 preconditions).
        canDecideReturn:
          type: boolean
          description: >-
            True when actor is the Area Manager of the reservation's management area and
            at least one Return on this reservation is PENDING (§8.3 preconditions).
        canCancel:
          type: boolean
          description: >-
            True when actor manages the reservation and its status has not yet reached
            a delivery-confirmed or later stage (§7.10 preconditions).
    activityLogs:
      type: array
      description: Audit trail of actions taken on this reservation, newest first.
      items:
        type: object
        required: [id, action, entityType, actor, createdAt]
        properties:
          id:
            type: string
            format: uuid
          action:
            type: string
          entityType:
            type: string
          entityId:
            type: [string, "null"]
            format: uuid
          details:
            type: [object, "null"]
            additionalProperties: true
          actor:
            $ref: "#/components/schemas/ReservationUser"
          createdAt:
            type: string
            format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ConfirmDeliveryItem:
  type: object
  additionalProperties: false
  required:
    - reservationItemId
  properties:
    reservationItemId:
      type: string
      format: uuid
    reservationItemUnitIds:
      type: array
      description: >-
        ASSIGNED ReservationItemUnit ids of this item to hand over now (unit-based,
        partial handover allowed -- omit to hand over every remaining ASSIGNED unit
        of this item, i.e. full handover). The item stays PREPARED until every
        assigned unit has been handed over across one or more calls.
      minItems: 1
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        format: uuid
ConfirmDeliveryRequest:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      description: Omit entirely to hand over every deliverable item visible to the actor, in full.
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/components/schemas/ConfirmDeliveryItem"
ReturnItemInput:
  type: object
  additionalProperties: false
  required:
    - reservationItemId
    - reservationItemUnitIds
  properties:
    reservationItemId:
      type: string
      format: uuid
    reservationItemUnitIds:
      type: array
      description: >-
        Checked-out reservation_item_unit IDs being dropped off for this item.
        Each unit must currently be CHECKED_OUT on this item.
      minItems: 1
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        format: uuid
    description:
      type: string
      maxLength: 2000
      nullable: true
CreateReturnRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/ReturnItemInput"
    note:
      type: string
      maxLength: 2000
      nullable: true
    immediateApprove:
      type: boolean
DecideReturnItemUnitInput:
  type: object
  additionalProperties: false
  required:
    - reservationItemUnitId
    - condition
  properties:
    reservationItemUnitId:
      type: string
      format: uuid
    condition:
      type: string
      description: Per-unit inspection outcome. Required for every unit in the slip when decision is APPROVE.
      enum: [GOOD, BROKEN, LOST]
DecideReturnItemInput:
  type: object
  additionalProperties: false
  required:
    - reservationItemId
  properties:
    reservationItemId:
      type: string
      format: uuid
    units:
      type: array
      description: Per-serial condition decisions for this item's return-item units.
      items:
        $ref: "#/components/schemas/DecideReturnItemUnitInput"
    description:
      type: string
      maxLength: 2000
      nullable: true
ReturnDecisionRequest:
  type: object
  additionalProperties: false
  required:
    - decision
  properties:
    decision:
      type: string
      enum: [APPROVE, REJECT]
    items:
      type: array
      description: Grouped by reservation item -- each entry's `units[]` carries the per-serial condition decisions, and `description` sets that item's ReturnItem.description.
      items:
        $ref: "#/components/schemas/DecideReturnItemInput"
    description:
      type: string
      maxLength: 2000
      nullable: true
ReturnItemUnitDetail:
  type: object
  required:
    - id
    - returnItemId
    - reservationItemUnitId
    - assetUnitId
    - serialNumber
    - condition
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    returnItemId:
      type: string
      format: uuid
    reservationItemUnitId:
      type: string
      format: uuid
    assetUnitId:
      type: string
      format: uuid
    serialNumber:
      type: string
    condition:
      type: string
      description: NULL until inspected and decided at return-approval time.
      enum: [GOOD, BROKEN, LOST]
      nullable: true
    pictureUrl:
      type: string
      nullable: true
    note:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
ReturnItemDetail:
  type: object
  required:
    - id
    - returnId
    - reservationItemId
    - units
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    returnId:
      type: string
      format: uuid
    reservationItemId:
      type: string
      format: uuid
    assetId:
      type: string
      format: uuid
    assetName:
      type: string
    managementArea:
      $ref: "#/components/schemas/ManagementAreaRef"
    description:
      type: string
      nullable: true
    pictureUrl:
      type: string
      nullable: true
    units:
      type: array
      items:
        $ref: "#/components/schemas/ReturnItemUnitDetail"
    createdAt:
      type: string
      format: date-time
    reservationItem:
      $ref: "#/components/schemas/ReservationDetailItem"
      description: >-
        Not currently populated by the implementation. Clients should use
        assetId/assetName/managementArea above instead.
ReturnApprovalDetail:
  type: object
  required:
    - id
    - returnId
    - approverId
    - status
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    returnId:
      type: string
      format: uuid
    approverId:
      type: string
      format: uuid
    status:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    description:
      type: string
      nullable: true
    decidedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    approver:
      $ref: "#/components/schemas/ReservationUser"
ReturnDetail:
  type: object
  required:
    - id
    - reservationId
    - returnedBy
    - status
    - items
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    reservationId:
      type: string
      format: uuid
    returnedBy:
      type: string
      format: uuid
    status:
      type: string
      enum: [PENDING, APPROVED, REJECTED, COMPLETED]
    returnedAt:
      type: string
      format: date-time
      nullable: true
    returner:
      $ref: "#/components/schemas/ReservationUser"
    note:
      type: string
      nullable: true
    items:
      type: array
      items:
        $ref: "#/components/schemas/ReturnItemDetail"
    approval:
      $ref: "#/components/schemas/ReturnApprovalDetail"
    capabilities:
      type: object
      required: [canApprove, canReject]
      properties:
        canApprove:
          type: boolean
        canReject:
          type: boolean
    reservation:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ReturnListResponse:
  type: object
  required:
    - data
    - pageInfo
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/ReturnDetail"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"

