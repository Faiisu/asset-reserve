AssetReservationCount:
  type: object
  required:
    - assetId
    - name
    - partNumber
    - managementArea
    - approvedCount
    - rejectedCount
    - activeUnitCount
    - utilizationPercent
    - brokenCount
    - lostCount
  properties:
    assetId:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 40
    partNumber:
      type:
        - string
        - "null"
      maxLength: 100
    managementArea:
      $ref: "#/components/schemas/ManagementAreaRef"
    approvedCount:
      type: integer
      minimum: 0
      description: >-
        Count of this asset's reservation items whose ReservationItemApproval.status is APPROVED,
        where the reservation's booked window overlaps [start, end]. Counted on the reservation's
        startAt/endAt rather than a decision timestamp, so the number reflects when the equipment
        is actually booked rather than when the approval happened to be processed.
    rejectedCount:
      type: integer
      minimum: 0
      description: >-
        Count of this asset's reservation items whose ReservationItemApproval.status is REJECTED,
        under the same booked-window rule as approvedCount. A PENDING approval counts toward
        neither field.
    activeUnitCount:
      type: integer
      minimum: 0
      description: >-
        Count of this asset's AssetUnit rows that are not INACTIVE and existed before the window
        ended -- the capacity utilizationPercent is measured against. A retired unit stops
        counting from the moment it is retired onward, the same way AssetSummary.unitCounts.total
        already excludes INACTIVE units.
    utilizationPercent:
      type:
        - number
        - "null"
      minimum: 0
      maximum: 100
      description: >-
        What fraction of this asset's own capacity was actually checked out during [start, end]:
        (hours its active units spent checked out in the window) / (activeUnitCount * window
        hours), as a percentage rounded to one decimal. A unit still checked out (no returnedAt
        yet) counts as occupied through the window's end. null when activeUnitCount is 0 -- there
        is no capacity to divide by. Two assets can show the same approvedCount and a different
        utilizationPercent: one might be a single unit in constant use, the other ten units that
        are mostly idle.
    brokenCount:
      type: integer
      minimum: 0
      description: >-
        Count of this asset's ReservationItemUnit rows whose status is RETURNED_BROKEN and whose
        returnedAt falls inside [start, end). Scoped by returnedAt -- when the return inspection
        recorded the condition -- rather than by the reservation's booked window used for
        approvedCount/rejectedCount: those count a decision about a booking, this counts a
        physical event that the inspection itself creates. A unit booked in January but not
        inspected until March counts toward March.
    lostCount:
      type: integer
      minimum: 0
      description: >-
        Count of this asset's ReservationItemUnit rows whose status is RETURNED_LOST, under the
        same returnedAt rule as brokenCount. A unit still checked out and overdue is not counted
        here -- nothing is lost until an inspection says so.
ReservationsByAssetResponse:
  type: object
  required:
    - periodStart
    - periodEnd
    - data
  properties:
    periodStart:
      type: string
      format: date-time
      description: Inclusive start of the resolved date range, in UTC (midnight of the requested `start`).
    periodEnd:
      type: string
      format: date-time
      description: Exclusive end of the resolved date range, in UTC (midnight of the day after the requested `end`).
    data:
      type: array
      maxItems: 200
      items:
        $ref: "#/components/schemas/AssetReservationCount"
