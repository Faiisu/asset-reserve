StatisticsPeriod:
  type: string
  description: The aggregation window for statistics endpoints, anchored to the current UTC calendar boundary (see each endpoint's description for the exact start).
  enum:
    - day
    - week
    - month
    - year
AssetReservationCount:
  type: object
  required:
    - assetId
    - name
    - partNumber
    - managementArea
    - approvedCount
    - rejectedCount
  properties:
    assetId:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 40
    partNumber:
      type:
        - string
        - "null"
      maxLength: 100
    managementArea:
      $ref: "#/components/schemas/ManagementAreaRef"
    approvedCount:
      type: integer
      minimum: 0
      description: >-
        Count of this asset's reservation items whose ReservationItemApproval.status is APPROVED,
        where the reservation's booked window overlaps the period. Counted on the reservation's
        startAt/endAt rather than a decision timestamp, so the number reflects when the equipment
        is actually booked rather than when the approval happened to be processed.
    rejectedCount:
      type: integer
      minimum: 0
      description: >-
        Count of this asset's reservation items whose ReservationItemApproval.status is REJECTED,
        under the same booked-window rule as approvedCount. A PENDING approval counts toward
        neither field.
ReservationsByAssetResponse:
  type: object
  required:
    - period
    - periodStart
    - periodEnd
    - data
  properties:
    period:
      $ref: "#/components/schemas/StatisticsPeriod"
    periodStart:
      type: string
      format: date-time
      description: Inclusive start of the resolved period window, in UTC.
    periodEnd:
      type: string
      format: date-time
      description: Exclusive end of the resolved period window, in UTC.
    data:
      type: array
      maxItems: 200
      items:
        $ref: "#/components/schemas/AssetReservationCount"
