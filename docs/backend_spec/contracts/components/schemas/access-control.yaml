PermissionKey:
  type: string
  enum:
    - asset:create
    - asset:view
    - asset:update
    - asset:delete
    - reservation:create
    - reservation:update
    - reservation:approve
    - reservation:reject
    - return:approve
    - user:create
    - user:disable
    - role:assign
RoleName:
  type: string
  description: Built-in roles include ADMIN, MANAGER, and USER; global administrators may create additional names.
  examples:
    - ADMIN
    - TECHNICIAN
ManagementAreaRef:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 150
PermissionDefinition:
  type: object
  required:
    - key
    - resource
    - action
    - description
  properties:
    key:
      $ref: "#/components/schemas/PermissionKey"
    resource:
      type: string
    action:
      type: string
    description:
      type: string
Role:
  type: object
  required:
    - id
    - name
    - description
    - permissions
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    name:
      $ref: "#/components/schemas/RoleName"
    description:
      type:
        - string
        - "null"
    permissions:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/PermissionKey"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
CreateRoleRequest:
  type: object
  additionalProperties: false
  required:
    - name
    - permissions
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: Case-insensitive unique role name; persisted in uppercase.
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    permissions:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/PermissionKey"
UpdateRoleRequest:
  type: object
  additionalProperties: false
  minProperties: 2
  required:
    - expectedUpdatedAt
  properties:
    description:
      type:
        - string
        - "null"
    permissions:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/PermissionKey"
    expectedUpdatedAt:
      type: string
      format: date-time
ManagementArea:
  allOf:
    - $ref: "#/components/schemas/ManagementAreaRef"
    - type: object
      required:
        - description
        - createdAt
        - updatedAt
      properties:
        description:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
ManagementAreaListResponse:
  type: object
  required:
    - data
    - pageInfo
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/ManagementArea"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
ManagementAreaDetail:
  allOf:
    - $ref: "#/components/schemas/ManagementArea"
    - type: object
      required:
        - assetCount
        - userRoleCount
      properties:
        assetCount:
          type: integer
          minimum: 0
        userRoleCount:
          type: integer
          minimum: 0
CreateManagementAreaRequest:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
      maxLength: 1000
UpdateManagementAreaRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
      maxLength: 1000
