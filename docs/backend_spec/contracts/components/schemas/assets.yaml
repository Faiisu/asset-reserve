AssetStatus:
  type: string
  enum:
    - ACTIVE
    - INACTIVE
AssetTemplateRef:
  type: object
  required:
    - id
    - name
    - description
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 150
    description:
      type:
        - string
        - "null"
AssetOwner:
  type: object
  required:
    - id
    - email
    - name
    - profilePictureUrl
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type:
        - string
        - "null"
    profilePictureUrl:
      type:
        - string
        - "null"
      format: uri
AssetCapabilities:
  type: object
  required:
    - canEdit
    - canDeactivate
    - canAdjustQuantity
  properties:
    canEdit:
      type: boolean
    canDeactivate:
      type: boolean
    canAdjustQuantity:
      type: boolean
AssetSummary:
  type: object
  required:
    - id
    - name
    - description
    - pictureUrl
    - totalQuantity
    - allocatedQuantity
    - availableQuantity
    - isActive
    - status
    - assetTemplate
    - managementArea
    - owner
    - capabilities
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 150
    description:
      type:
        - string
        - "null"
    pictureUrl:
      type:
        - string
        - "null"
      format: uri
      maxLength: 2048
    totalQuantity:
      type: integer
      minimum: 0
      maximum: 2147483647
    allocatedQuantity:
      type: integer
      minimum: 0
      description: Quantity allocated by approved reservations. When `from` and `to` are supplied to the list endpoint, only overlapping reservations are counted.
    availableQuantity:
      type: integer
      minimum: 0
      description: Total quantity minus the allocated quantity for the requested availability window.
    isActive:
      type: boolean
    status:
      $ref: "#/components/schemas/AssetStatus"
    assetTemplate:
      oneOf:
        - $ref: "#/components/schemas/AssetTemplateRef"
        - type: "null"
    managementArea:
      $ref: "#/components/schemas/ManagementAreaRef"
    owner:
      oneOf:
        - $ref: "#/components/schemas/AssetOwner"
        - type: "null"
    capabilities:
      $ref: "#/components/schemas/AssetCapabilities"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
AssetListResponse:
  type: object
  required:
    - data
    - pageInfo
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/AssetSummary"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
ReservationRef:
  type: object
  required:
    - id
    - eventName
    - status
    - startAt
    - endAt
  properties:
    id:
      type: string
      format: uuid
    eventName:
      type: string
    status:
      type: string
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
ActiveReservationItem:
  type: object
  required:
    - id
    - quantity
    - status
    - reservation
  properties:
    id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
    status:
      type: string
      enum:
        - APPROVED
        - PREPARED
        - CHECKED_OUT
    reservation:
      $ref: "#/components/schemas/ReservationRef"
InventoryLedgerItem:
  type: object
  required:
    - id
    - batchId
    - transactionType
    - quantityDelta
    - reason
    - createdAt
    - batchDescription
    - performedBy
  properties:
    id:
      type: string
      format: uuid
    batchId:
      type: string
      format: uuid
    transactionType:
      type: string
      enum:
        - ADD
        - REMOVE
        - LOST
        - BROKEN
        - REPAIR
        - RETURN
        - ADJUSTMENT
    quantityDelta:
      type: integer
    reason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    batchDescription:
      type:
        - string
        - "null"
    performedBy:
      $ref: "#/components/schemas/AssetOwner"
AssetEditPolicy:
  type: object
  required:
    - permission
    - roles
  properties:
    permission:
      type: string
      const: asset:update
    roles:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/RoleName"
AssetDetail:
  allOf:
    - $ref: "#/components/schemas/AssetSummary"
    - type: object
      required:
        - editPolicy
        - activeReservationItems
        - inventoryLedger
      properties:
        editPolicy:
          $ref: "#/components/schemas/AssetEditPolicy"
        activeReservationItems:
          type: array
          items:
            $ref: "#/components/schemas/ActiveReservationItem"
        inventoryLedger:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/InventoryLedgerItem"
CreateAssetRequest:
  type: object
  additionalProperties: false
  required:
    - name
    - managementAreaId
    - totalQuantity
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    managementAreaId:
      type: string
      format: uuid
    assetTemplateId:
      type:
        - string
        - "null"
      format: uuid
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    pictureUrl:
      type:
        - string
        - "null"
      format: uri
      maxLength: 2048
    totalQuantity:
      type: integer
      minimum: 0
      maximum: 2147483647
    isActive:
      type: boolean
      default: true
  example:
    name: Epson EB-FH52 Projector
    managementAreaId: 00000000-0000-4000-8000-000000000201
    description: Full HD portable projector with HDMI cable.
    pictureUrl: https://assets.example.test/projector.jpg
    totalQuantity: 6
    isActive: true
BatchCreateAssetsRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/components/schemas/CreateAssetRequest"
    description:
      type: string
      maxLength: 2000
AssetBatchResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/AssetSummary"
UpdateAssetRequest:
  type: object
  additionalProperties: false
  minProperties: 2
  required:
    - expectedUpdatedAt
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    managementAreaId:
      type: string
      format: uuid
    assetTemplateId:
      type:
        - string
        - "null"
      format: uuid
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    pictureUrl:
      type:
        - string
        - "null"
      format: uri
      maxLength: 2048
    expectedUpdatedAt:
      type: string
      format: date-time
UpdateAssetStatusRequest:
  type: object
  additionalProperties: false
  required:
    - status
    - expectedUpdatedAt
  properties:
    status:
      $ref: "#/components/schemas/AssetStatus"
    expectedUpdatedAt:
      type: string
      format: date-time
BatchRemoveAssetItem:
  type: object
  additionalProperties: false
  required:
    - assetId
    - expectedUpdatedAt
  properties:
    assetId:
      type: string
      format: uuid
    expectedUpdatedAt:
      type: string
      format: date-time
BatchRemoveAssetsRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        $ref: "#/components/schemas/BatchRemoveAssetItem"
RemovedAsset:
  type: object
  required:
    - id
    - status
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      const: INACTIVE
BatchRemoveAssetsResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/RemovedAsset"
