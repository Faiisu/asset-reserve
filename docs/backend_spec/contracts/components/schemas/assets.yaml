AssetStatus:
  type: string
  description: The asset-level active/inactive toggle, set via PATCH /assets/{assetId}/status. Distinct from AssetUnitStatus, which tracks each physical unit.
  enum:
    - ACTIVE
    - INACTIVE
AssetUnitStatus:
  type: string
  description: Status of one physical, serial-numbered unit.
  enum:
    - ACTIVE
    - RESERVED
    - CHECKED_OUT
    - BROKEN
    - LOST
    - IN_REPAIR
    - INACTIVE
AssetOwner:
  type: object
  required:
    - id
    - email
    - name
    - profilePictureUrl
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type:
        - string
        - "null"
    profilePictureUrl:
      type:
        - string
        - "null"
      format: uri
AssetCapabilities:
  type: object
  required:
    - canEdit
    - canDeactivate
    - canManageUnits
  properties:
    canEdit:
      type: boolean
    canDeactivate:
      type: boolean
    canManageUnits:
      type: boolean
      description: Whether the caller may register/retire/adjust this asset's units (formerly canAdjustQuantity).
AssetUnitCounts:
  type: object
  description: Computed by counting this asset's asset_units rows -- not stored on the asset itself.
  required:
    - total
    - active
    - reserved
    - checkedOut
    - broken
    - lost
    - inRepair
    - inactive
  properties:
    total:
      type: integer
      minimum: 0
      description: Count of all units except those with status INACTIVE.
    active:
      type: integer
      minimum: 0
      description: Units currently useable/available to reserve -- excludes reserved, checked-out, broken, lost, and in-repair units.
    reserved:
      type: integer
      minimum: 0
    checkedOut:
      type: integer
      minimum: 0
    broken:
      type: integer
      minimum: 0
    lost:
      type: integer
      minimum: 0
    inRepair:
      type: integer
      minimum: 0
    inactive:
      type: integer
      minimum: 0
AssetSummary:
  type: object
  required:
    - id
    - name
    - partNumber
    - description
    - pictureUrl
    - totalQuantity
    - allocatedQuantity
    - availableQuantity
    - unitCounts
    - isActive
    - managementArea
    - owner
    - capabilities
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 40
    partNumber:
      type:
        - string
        - "null"
      maxLength: 100
    description:
      type:
        - string
        - "null"
    pictureUrl:
      type:
        - string
        - "null"
      description: Absolute URL or application-relative path such as /uploads/image.webp.
      maxLength: 2048
    totalQuantity:
      type: integer
      minimum: 0
      description: Derived -- same value as unitCounts.total. Count of this asset's units, excluding INACTIVE ones.
    allocatedQuantity:
      type: integer
      minimum: 0
      description: Quantity allocated by approved reservations. When `from` and `to` are supplied to the list endpoint, only overlapping reservations are counted.
    availableQuantity:
      type: integer
      minimum: 0
      description: unitCounts.active minus the allocated quantity for the requested availability window.
    unitCounts:
      $ref: "#/components/schemas/AssetUnitCounts"
    isActive:
      type: boolean
    managementArea:
      $ref: "#/components/schemas/ManagementAreaRef"
    owner:
      oneOf:
        - $ref: "#/components/schemas/AssetOwner"
        - type: "null"
    capabilities:
      $ref: "#/components/schemas/AssetCapabilities"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
AssetListResponse:
  type: object
  required:
    - data
    - pageInfo
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/AssetSummary"
    pageInfo:
      $ref: "#/components/schemas/PageInfo"
ReservationRef:
  type: object
  required:
    - id
    - eventName
    - status
    - startAt
    - endAt
  properties:
    id:
      type: string
      format: uuid
    eventName:
      type: string
    status:
      type: string
    startAt:
      type: string
      format: date-time
    endAt:
      type: string
      format: date-time
ActiveReservationItem:
  type: object
  required:
    - id
    - quantity
    - status
    - reservation
  properties:
    id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
    status:
      type: string
      description: >-
        Uses ReservationItemStatus values -- PREPARED is reached directly on approval (§7.5 of
        algorithms-and-validation.md), there is no separate APPROVED resting state.
      enum:
        - PREPARED
        - DELIVERED
    reservation:
      $ref: "#/components/schemas/ReservationRef"
AssetUnit:
  type: object
  required:
    - id
    - serialNumber
    - status
    - note
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    serialNumber:
      type: string
      maxLength: 100
    status:
      $ref: "#/components/schemas/AssetUnitStatus"
    note:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
AssetUnitEventLedgerItem:
  type: object
  required:
    - id
    - batchId
    - assetUnitId
    - serialNumber
    - eventType
    - fromStatus
    - toStatus
    - reason
    - createdAt
    - batchDescription
    - performedBy
  properties:
    id:
      type: string
      format: uuid
    batchId:
      type: string
      format: uuid
    assetUnitId:
      type: string
      format: uuid
    serialNumber:
      type: string
      maxLength: 100
    eventType:
      type: string
      enum:
        - REGISTERED
        - RETIRED
        - REACTIVATED
        - RESERVED
        - CHECKED_OUT
        - RETURNED_GOOD
        - RETURNED_BROKEN
        - RETURNED_LOST
        - REPAIRED
        - ADJUSTMENT
    fromStatus:
      oneOf:
        - $ref: "#/components/schemas/AssetUnitStatus"
        - type: "null"
    toStatus:
      oneOf:
        - $ref: "#/components/schemas/AssetUnitStatus"
        - type: "null"
    reason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    batchDescription:
      type:
        - string
        - "null"
    performedBy:
      $ref: "#/components/schemas/AssetOwner"
AssetEditPolicy:
  type: object
  required:
    - permission
    - roles
  properties:
    permission:
      type: string
      const: asset:update
    roles:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/RoleName"
AssetDetail:
  allOf:
    - $ref: "#/components/schemas/AssetSummary"
    - type: object
      required:
        - editPolicy
        - activeReservationItems
        - units
        - unitEventLedger
      properties:
        editPolicy:
          $ref: "#/components/schemas/AssetEditPolicy"
        activeReservationItems:
          type: array
          items:
            $ref: "#/components/schemas/ActiveReservationItem"
        units:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AssetUnit"
        unitEventLedger:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AssetUnitEventLedgerItem"
CreateAssetRequest:
  type: object
  additionalProperties: false
  required:
    - name
    - managementAreaId
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 40
    managementAreaId:
      type: string
      format: uuid
    partNumber:
      type:
        - string
        - "null"
      maxLength: 100
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    pictureUrl:
      type:
        - string
        - "null"
      description: Absolute URL or application-relative path such as /uploads/image.webp.
      maxLength: 2048
    isActive:
      type: boolean
      default: true
  example:
    name: Epson EB-FH52 Projector
    managementAreaId: 00000000-0000-4000-8000-000000000201
    partNumber: EPS-PRJ-100
    description: Full HD portable projector with HDMI cable.
    pictureUrl: https://assets.example.test/projector.jpg
    isActive: true
RegisterAssetUnitsRequest:
  type: object
  additionalProperties: false
  required:
    - serialNumbers
  properties:
    serialNumbers:
      type: array
      minItems: 1
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 100
    reason:
      type: string
      maxLength: 2000
RegisterAssetUnitsResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/AssetUnit"
RetireAssetUnitItem:
  type: object
  additionalProperties: false
  required:
    - assetUnitId
    - expectedUpdatedAt
  properties:
    assetUnitId:
      type: string
      format: uuid
    expectedUpdatedAt:
      type: string
      format: date-time
RetireAssetUnitsRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 200
      items:
        $ref: "#/components/schemas/RetireAssetUnitItem"
    reason:
      type: string
      maxLength: 2000
UpdateAssetUnitStatusRequest:
  type: object
  additionalProperties: false
  required:
    - status
    - expectedUpdatedAt
  properties:
    status:
      type: string
      description: RESERVED/CHECKED_OUT are system-managed by the reservation flow and cannot be set directly here.
      enum:
        - ACTIVE
        - BROKEN
        - LOST
        - IN_REPAIR
        - INACTIVE
    reason:
      type: string
      maxLength: 2000
    expectedUpdatedAt:
      type: string
      format: date-time
BatchCreateAssetsRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/components/schemas/CreateAssetRequest"
    description:
      type: string
      maxLength: 2000
AssetBatchResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/AssetSummary"
UpdateAssetRequest:
  type: object
  additionalProperties: false
  minProperties: 2
  required:
    - expectedUpdatedAt
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 40
    managementAreaId:
      type: string
      format: uuid
    partNumber:
      type:
        - string
        - "null"
      maxLength: 100
    description:
      type:
        - string
        - "null"
      maxLength: 10000
    pictureUrl:
      type:
        - string
        - "null"
      description: Absolute URL or application-relative path such as /uploads/image.webp.
      maxLength: 2048
    expectedUpdatedAt:
      type: string
      format: date-time
UpdateAssetStatusRequest:
  type: object
  additionalProperties: false
  required:
    - status
    - expectedUpdatedAt
  properties:
    status:
      $ref: "#/components/schemas/AssetStatus"
    expectedUpdatedAt:
      type: string
      format: date-time
BatchRemoveAssetItem:
  type: object
  additionalProperties: false
  required:
    - assetId
    - expectedUpdatedAt
  properties:
    assetId:
      type: string
      format: uuid
    expectedUpdatedAt:
      type: string
      format: date-time
BatchRemoveAssetsRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        $ref: "#/components/schemas/BatchRemoveAssetItem"
RemovedAsset:
  type: object
  required:
    - id
    - status
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      const: INACTIVE
BatchRemoveAssetsResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: "#/components/schemas/RemovedAsset"
