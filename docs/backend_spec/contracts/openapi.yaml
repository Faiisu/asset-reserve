openapi: 3.1.0
info:
  title: Asset Reservation API
  version: 1.3.0
  description: Contract-first API for authentication, access control, users, assets, inventory, asset templates, and reservations.
servers:
  - url: /api/v1
tags:
  - name: Authentication
    description: Password login and current session context.
  - name: Session BFF
    description: Session context for the frontend application shell.
  - name: Permissions
    description: Immutable application permission catalog.
  - name: Roles
    description: Role definitions and permission sets.
  - name: Users
    description: User administration and role assignments.
  - name: Management Areas
    description: Management-area lookup for scoped assignments.
  - name: Assets
    description: Scoped asset lookup, creation, editing, status, and soft removal.
  - name: Inventory
    description: Atomic audited quantity adjustments.
  - name: Asset Templates
    description: Picture-free reusable asset metadata.
  - name: Reservations
    description: Reservation details, item approvals, availability conflicts, overlap warnings, and post-approval changes.
security:
  - bearerAuth: []
