openapi: 3.1.0
info:
  title: Asset Reservation API
  version: 1.5.0
  description: Contract-first API for authentication, access control, users, management areas, serialized asset units, uploads, reservations, asset-photo recognition, email templates, and notification settings.
servers:
  - url: /api/v1
tags:
  - name: Authentication
    description: Username/password login, current session context, and alternate login via a linked Google/Microsoft account.
  - name: Account Linking
    description: Linking a Google or Microsoft identity to the signed-in user, and signing in with an identity already linked. See oauth-setup.md for setup and the account-link gate.
  - name: Session BFF
    description: Session context for the frontend application shell.
  - name: Permissions
    description: Immutable application permission catalog.
  - name: Roles
    description: Role definitions and permission sets.
  - name: Users
    description: User administration and role assignments.
  - name: Management Areas
    description: Management-area lookup for scoped assignments.
  - name: Assets
    description: Scoped asset lookup, creation, editing, status, and soft removal.
  - name: Reservations
    description: Reservation details, item approvals, availability conflicts, overlap warnings, and post-approval changes.
  - name: Returns
    description: Equipment return slips, drop-off verification, and inspection decision workflow.
  - name: Uploads
    description: Authenticated local image uploads used by asset and user forms.
  - name: Recognition
    description: Proxy to the internal recognition-service for asset reference photos and photo-based asset lookup. See modules/recognition.md.
  - name: Email Templates
    description: Global-admin management of the customizable subject/body for each outbound notification situation. See modules/email-templates.md.
  - name: Notification Settings
    description: Global-admin SMTP/notification configuration, singleton settings. See modules/notification-settings.md.
security:
  - bearerAuth: []
