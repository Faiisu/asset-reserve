  /reservations/{reservationId}/items/{itemId}/decision:
    $ref: ./paths/reservations.yaml#/~1reservations~1{reservationId}~1items~1{itemId}~1decision
  /reservations/{reservationId}/items/decision:
    $ref: ./paths/reservations.yaml#/~1reservations~1{reservationId}~1items~1decision
  /reservations/{reservationId}/change-requests:
