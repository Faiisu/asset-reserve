/assets/inventory/batch-add:
  post:
    tags:
      - Inventory
    summary: Add quantities to up to 100 assets atomically
    description: Requires asset:update for every asset. Creates one audit batch with positive ADD ledger deltas.
    operationId: addInventoryBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryBatchRequest"
    responses:
      "201":
        description: Quantities and ledger entries committed.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryBatchResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/inventory/batch-remove:
  post:
    tags:
      - Inventory
    summary: Remove quantities from up to 100 assets atomically
    description: Requires asset:update for every asset. The whole batch rolls back if any quantity would become negative.
    operationId: removeInventoryBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryBatchRequest"
    responses:
      "201":
        description: Quantities and negative REMOVE ledger entries committed.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryBatchResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
