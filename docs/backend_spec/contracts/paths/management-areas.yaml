/management-areas:
  get:
    tags: [Management Areas]
    summary: List management areas for scoped assignments
    operationId: listManagementAreas
    parameters:
      - $ref: "#/components/parameters/Search"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    responses:
      "200":
        description: Paginated management areas.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementAreaListResponse"
      "401": { $ref: "#/components/responses/Unauthorized" }
  post:
    tags: [Management Areas]
    summary: Create a management area
    operationId: createManagementArea
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateManagementAreaRequest" }
    responses:
      "201":
        description: Created management area.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagementArea" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "409": { $ref: "#/components/responses/Conflict" }
      "422": { $ref: "#/components/responses/ValidationError" }
/management-areas/{managementAreaId}:
  parameters:
    - $ref: "#/components/parameters/ManagementAreaId"
  get:
    tags: [Management Areas]
    summary: Get a management area with relation counts
    operationId: getManagementArea
    responses:
      "200":
        description: Management-area detail.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagementAreaDetail" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
  patch:
    tags: [Management Areas]
    summary: Update a management area
    operationId: updateManagementArea
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateManagementAreaRequest" }
    responses:
      "200":
        description: Updated management area.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagementArea" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }
      "422": { $ref: "#/components/responses/ValidationError" }
  delete:
    tags: [Management Areas]
    summary: Delete an empty management area
    operationId: deleteManagementArea
    responses:
      "200":
        description: Deleted area identifier.
        content:
          application/json:
            schema:
              type: object
              required: [success, id]
              properties:
                success: { type: boolean, const: true }
                id: { type: string, format: uuid }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
