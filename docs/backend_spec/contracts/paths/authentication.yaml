/auth/login:
  post:
    tags:
      - Authentication
    summary: Sign in with email and password
    operationId: login
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
    responses:
      "200":
        description: Authenticated successfully.
        headers:
          X-Request-Id:
            $ref: "#/components/headers/RequestId"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
      "429":
        $ref: "#/components/responses/RateLimited"
/auth/me:
  get:
    tags:
      - Authentication
    summary: Get the current session context
    operationId: getCurrentSession
    responses:
      "200":
        description: Current session context.
        content:
          application/json:
            schema:
              type: object
              required:
                - session
              properties:
                session:
                  $ref: "#/components/schemas/SessionContext"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
/auth/logout:
  post:
    tags:
      - Authentication
    summary: End the client session
    operationId: logout
    responses:
      "204":
        description: Client may discard the access token. No response body.
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
