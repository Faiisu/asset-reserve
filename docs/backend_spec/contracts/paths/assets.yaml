/assets:
  get:
    tags:
      - Assets
    summary: List assets visible in the caller's management-area scopes
    operationId: listAssets
    parameters:
      - $ref: "#/components/parameters/Search"
      - name: areaId
        in: query
        schema:
          type: string
          format: uuid
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: from
        in: query
        description: Availability window start. Must be supplied together with `to`.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Availability window end. Assets allocated by approved overlapping reservations are deducted from availability.
        schema:
          type: string
          format: date-time
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    responses:
      "200":
        description: Paginated assets with computed availability and caller capabilities.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetListResponse"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
  post:
    tags:
      - Assets
    summary: Create an asset and its opening inventory ledger entry
    description: Requires asset:create in the selected management area. The authenticated user becomes the owner.
    operationId: createAsset
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateAssetRequest"
    responses:
      "201":
        description: Created asset.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/batch:
  post:
    tags:
      - Assets
    summary: Create up to 100 assets atomically
    description: Requires asset:create for every management area in the batch. Opening ADD ledger entries are committed with the assets.
    operationId: createAssetBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchCreateAssetsRequest"
    responses:
      "201":
        description: All assets were created in input order.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetBatchResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/batch-remove:
  post:
    tags:
      - Assets
    summary: Soft-remove up to 100 assets atomically
    description: Requires asset:delete for every asset. Rows and ledger history are retained while status changes to INACTIVE.
    operationId: removeAssetBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchRemoveAssetsRequest"
    responses:
      "201":
        description: All selected assets are inactive.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRemoveAssetsResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/{assetId}:
  parameters:
    - $ref: "#/components/parameters/AssetId"
  get:
    tags:
      - Assets
    summary: Get asset details, active allocations, and recent ledger entries
    operationId: getAsset
    responses:
      "200":
        description: Asset detail. The inventory ledger is limited to the latest 50 entries.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetDetail"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
  patch:
    tags:
      - Assets
    summary: Update asset metadata
    description: Quantity changes must use the inventory batch endpoints. Moving an asset requires asset:update in both the old and new areas.
    operationId: updateAsset
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAssetRequest"
    responses:
      "200":
        description: Updated asset summary.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
  delete:
    tags:
      - Assets
    summary: Soft-remove an asset
    description: Requires asset:delete. Sets the asset to INACTIVE without deleting its row or history.
    operationId: removeAsset
    responses:
      "200":
        description: Inactive asset summary.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
/assets/{assetId}/status:
  patch:
    tags:
      - Assets
    summary: Activate or deactivate an asset
    description: Activating requires asset:update; deactivating requires asset:delete in the asset's area.
    operationId: updateAssetStatus
    parameters:
      - $ref: "#/components/parameters/AssetId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAssetStatusRequest"
    responses:
      "200":
        description: Updated asset summary.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
