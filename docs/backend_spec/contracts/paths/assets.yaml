/assets:
  get:
    tags:
      - Assets
    summary: List assets visible in the caller's management-area scopes
    operationId: listAssets
    parameters:
      - $ref: "#/components/parameters/Search"
      - name: areaId
        in: query
        schema:
          type: string
          format: uuid
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: from
        in: query
        description: Availability window start. Must be supplied together with `to`.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Availability window end. Distinct serial units with active assignments overlapping the window are deducted once from availability.
        schema:
          type: string
          format: date-time
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    responses:
      "200":
        description: Paginated assets with computed availability and caller capabilities.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetListResponse"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
  post:
    tags:
      - Assets
    summary: Create an asset catalog entry (part number), with zero units
    description: Requires asset:create in the selected management area. The authenticated user becomes the owner. Creates the catalog row only -- physical units are registered separately via POST /assets/{assetId}/units.
    operationId: createAsset
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateAssetRequest"
    responses:
      "201":
        description: Created asset.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/batch:
  post:
    tags:
      - Assets
    summary: Create up to 100 asset catalog entries atomically
    description: Requires asset:create for every management area in the batch. Each asset is created with zero units.
    operationId: createAssetBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchCreateAssetsRequest"
    responses:
      "201":
        description: All assets were created in input order.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetBatchResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/batch-remove:
  post:
    tags:
      - Assets
    summary: Soft-remove up to 100 assets atomically
    description: Requires asset:delete for every asset. Rows, units, and event history are retained while isActive is set to false.
    operationId: removeAssetBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchRemoveAssetsRequest"
    responses:
      "201":
        description: All selected assets are inactive.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRemoveAssetsResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/{assetId}:
  parameters:
    - $ref: "#/components/parameters/AssetId"
  get:
    tags:
      - Assets
    summary: Get asset details, its units, active allocations, and recent unit event history
    operationId: getAsset
    responses:
      "200":
        description: Asset detail, including up to 500 units and the latest 50 unit event ledger entries.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetDetail"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
  patch:
    tags:
      - Assets
    summary: Update asset metadata
    description: Unit registration/retirement/status changes must use the /assets/{assetId}/units and /assets/units endpoints below. Moving an asset requires asset:update in both the old and new areas.
    operationId: updateAsset
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAssetRequest"
    responses:
      "200":
        description: Updated asset summary.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
  delete:
    tags:
      - Assets
    summary: Soft-remove an asset
    description: Requires asset:delete. Sets the asset to INACTIVE without deleting its row or history.
    operationId: removeAsset
    responses:
      "200":
        description: Inactive asset summary.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
/assets/{assetId}/status:
  patch:
    tags:
      - Assets
    summary: Activate or deactivate an asset
    description: Activating requires asset:update; deactivating requires asset:delete in the asset's area.
    operationId: updateAssetStatus
    parameters:
      - $ref: "#/components/parameters/AssetId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAssetStatusRequest"
    responses:
      "200":
        description: Updated asset summary.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetSummary"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/{assetId}/units:
  parameters:
    - $ref: "#/components/parameters/AssetId"
  get:
    tags:
      - Assets
    summary: List an asset's physical units
    description: >-
      Requires asset:view in the asset's area. Optionally filter by unit status. When both from
      and to are supplied, returns physically schedulable units that have no active assignment
      overlapping the half-open [from, to) window. from and to must be supplied together.
    operationId: listAssetUnits
    parameters:
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/AssetUnitStatus"
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: "#/components/parameters/Search"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    responses:
      "200":
        description: Paginated units for this asset.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - pageInfo
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/AssetUnit"
                pageInfo:
                  $ref: "#/components/schemas/PageInfo"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "422":
        $ref: "#/components/responses/ValidationError"
  post:
    tags:
      - Assets
    summary: Register new serial-numbered units for an asset
    description: Requires asset:update in the asset's area. Creates one AssetUnit per serial number (status ACTIVE) and one REGISTERED event per unit in a single event batch. Serial numbers must be globally unique.
    operationId: registerAssetUnits
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterAssetUnitsRequest"
    responses:
      "201":
        description: Registered units.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAssetUnitsResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        description: One or more serial numbers already exist (SERIAL_NUMBER_ALREADY_EXISTS).
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/units:
  get:
    tags:
      - Assets
    summary: Search asset units by serial number across all assets the caller can view
    description: >-
      Requires asset:view; results are scoped to the caller's permitted management areas the same
      way GET /assets is. `search` matches the unit's serial number OR its owning asset's name,
      part number, or management area name (any one match qualifies) -- selection is still by
      serial number, this just widens how a unit can be found.
    operationId: searchAssetUnits
    parameters:
      - $ref: "#/components/parameters/Search"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    responses:
      "200":
        description: Paginated units matching the search, each with its owning asset's name, part number, and management area.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUnitSearchResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/units/{assetUnitId}/events:
  get:
    tags:
      - Assets
    summary: Full event history and stats for one asset unit
    description: Requires asset:view in the unit's asset area. Returns every asset_unit_events row for this unit (unlike AssetDetail.unitEventLedger, which is asset-scoped and capped at 50), plus counts by eventType.
    operationId: getAssetUnitHistory
    parameters:
      - name: assetUnitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Unit summary, event-type counts, and the full event list (newest first).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUnitHistoryResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
/assets/units/batch-retire:
  post:
    tags:
      - Assets
    summary: Retire (deactivate) up to 200 asset units atomically
    description: Requires asset:update in each unit's asset area. Sets AssetUnit.status to INACTIVE. Fails with 409 if a targeted unit is physically checked out/legacy RESERVED or has an active current or future assignment.
    operationId: retireAssetUnits
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RetireAssetUnitsRequest"
    responses:
      "201":
        description: Retired units.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/AssetUnit"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/assets/units/{assetUnitId}/status:
  patch:
    tags:
      - Assets
    summary: Manually change one unit's status (e.g. mark broken, send for repair, reactivate)
    description: Requires asset:update in the unit's asset area. CHECKED_OUT is managed by handover/return and RESERVED is legacy-only; neither can be set here. Deactivation fails while an active current or future assignment exists.
    operationId: updateAssetUnitStatus
    parameters:
      - name: assetUnitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAssetUnitStatusRequest"
    responses:
      "200":
        description: Updated unit.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUnit"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
