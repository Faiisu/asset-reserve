/returns:
  get:
    tags:
      - Returns
    summary: List return records visible or actionable to the current user
    operationId: listReturns
    parameters:
      - name: view
        in: query
        schema:
          type: string
          enum: [MINE, APPROVALS, ALL]
          default: MINE
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, REJECTED, COMPLETED]
      - name: areaId
        in: query
        schema:
          type: string
          format: uuid
      - name: reservationId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/Search"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    responses:
      "200":
        description: Cursor-paginated return records scoped to the actor.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnListResponse"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "422":
        $ref: "#/components/responses/ValidationError"
/returns/{returnId}:
  parameters:
    - $ref: "#/components/parameters/ReturnId"
  get:
    tags:
      - Returns
    summary: Get single return slip details with items, condition breakdown, and approval status
    operationId: getReturn
    responses:
      "200":
        description: Return slip detail.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnDetail"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
