/asset-templates:
  get:
    tags:
      - Asset Templates
    summary: List asset templates
    description: Requires asset:view in the global scope or at least one management area.
    operationId: listAssetTemplates
    parameters:
      - $ref: "#/components/parameters/Search"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
    responses:
      "200":
        description: Paginated templates.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetTemplateListResponse"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
  post:
    tags:
      - Asset Templates
    summary: Create an asset template
    description: Requires asset:create in the global scope or at least one management area.
    operationId: createAssetTemplate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateAssetTemplateRequest"
    responses:
      "201":
        description: Created template.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetTemplate"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
/asset-templates/{templateId}:
  patch:
    tags:
      - Asset Templates
    summary: Update an asset template
    description: Requires asset:update in the global scope or at least one management area.
    operationId: updateAssetTemplate
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAssetTemplateRequest"
    responses:
      "200":
        description: Updated template.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetTemplate"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "422":
        $ref: "#/components/responses/ValidationError"
