/statistics/reservations-by-asset:
  get:
    tags:
      - Statistics
    summary: Reservation-request counts per asset for the current period
    description: >-
      Requires asset:view; results are scoped to the caller's permitted management areas the same
      way GET /assets is. Returns every permitted asset (even with zero reservations), each with
      the count of its reservation items whose reservation's booked window overlaps the period --
      regardless of reservation/item status (draft, pending, approved, rejected all count).
      `period` selects a half-open [periodStart, periodEnd) window on the current UTC calendar:
      day = today, week = this ISO week (Monday start), month = this calendar month, year = this
      calendar year. A reservation counts when it starts before the window ends and ends after
      the window begins -- the same overlap convention used for unit availability elsewhere in
      this API. Capped at the 200 assets with the highest reservedCount.
    operationId: getReservationsByAsset
    parameters:
      - name: period
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/StatisticsPeriod"
    responses:
      "200":
        description: Reservation-request counts per asset for the selected period.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationsByAssetResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
