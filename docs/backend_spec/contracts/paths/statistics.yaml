/statistics/reservations-by-asset:
  get:
    tags:
      - Statistics
    summary: Approval, utilization, and damage statistics per asset for a date range
    description: >-
      Requires asset:view; results are scoped to the caller's permitted management areas the same
      way GET /assets is. Returns every permitted asset (even with zero decisions or zero
      utilization), each with the count of its reservation items whose approval decision was
      APPROVED, and separately REJECTED (a PENDING approval counts toward neither), where the
      reservation's booked window overlaps [start, end]; and separately, the fraction of the
      asset's own capacity actually checked out in that same window (utilizationPercent, backed by
      activeUnitCount -- see the schema for the full utilization formula). Both bounds are calendar
      dates on the UTC clock -- the whole named end day is included, so `end=2026-08-31` covers
      bookings up to 2026-09-01T00:00:00Z. A reservation counts toward approvedCount/rejectedCount
      when it starts before the window ends and ends after the window begins -- the same overlap
      convention used for unit availability elsewhere in this API. Also returns brokenCount and
      lostCount -- units a return inspection marked RETURNED_BROKEN or RETURNED_LOST -- scoped by
      returnedAt (when the inspection recorded the condition) rather than by the booked window,
      since an inspection is what creates the fact being counted. Capped at the 200 assets with
      the highest approvedCount + rejectedCount (utilizationPercent, brokenCount, and lostCount do
      not affect ranking or the cap).
    operationId: getReservationsByAsset
    parameters:
      - name: start
        in: query
        required: true
        description: Inclusive start of the reporting window, as `YYYY-MM-DD` or a full ISO-8601 timestamp (only its UTC calendar date is read).
        schema:
          type: string
          format: date
        example: "2026-08-01"
      - name: end
        in: query
        required: true
        description: Inclusive end of the reporting window, same format as `start`. Must be on or after `start`.
        schema:
          type: string
          format: date
        example: "2026-08-31"
    responses:
      "200":
        description: Reservation-request counts per asset for the selected date range.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationsByAssetResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
