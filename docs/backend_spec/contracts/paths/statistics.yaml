/statistics/reservations-by-asset:
  get:
    tags:
      - Statistics
    summary: Approved and rejected reservation-item counts per asset for a date range
    description: >-
      Requires asset:view; results are scoped to the caller's permitted management areas the same
      way GET /assets is. Returns every permitted asset (even with zero decisions), each with the
      count of its reservation items whose approval decision was APPROVED, and separately REJECTED
      (a PENDING approval counts toward neither), where the reservation's booked window overlaps
      [start, end]. Both bounds are calendar dates on the UTC clock -- the whole named end day is
      included, so `end=2026-08-31` covers bookings up to 2026-09-01T00:00:00Z. A reservation
      counts when it starts before the window ends and ends after the window begins -- the same
      overlap convention used for unit availability elsewhere in this API. Capped at the 200
      assets with the highest approvedCount + rejectedCount.
    operationId: getReservationsByAsset
    parameters:
      - name: start
        in: query
        required: true
        description: Inclusive start of the reporting window, as `YYYY-MM-DD` or a full ISO-8601 timestamp (only its UTC calendar date is read).
        schema:
          type: string
          format: date
        example: "2026-08-01"
      - name: end
        in: query
        required: true
        description: Inclusive end of the reporting window, same format as `start`. Must be on or after `start`.
        schema:
          type: string
          format: date
        example: "2026-08-31"
    responses:
      "200":
        description: Reservation-request counts per asset for the selected date range.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationsByAssetResponse"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        $ref: "#/components/responses/ValidationError"
