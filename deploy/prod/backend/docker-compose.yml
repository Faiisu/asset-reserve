name: asset-reservation-backend

x-backend-environment: &backend-environment
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://asset_reservation:change-this-database-password@postgres:5432/asset_reservation?schema=public}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}

services:
  # Idempotent on every redeploy: `prisma migrate deploy` only applies
  # pending migrations, and the seed only upserts -- neither touches
  # existing rows, so the database keeps its data across `down`/`up`.
  schema:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
      target: schema
    environment:
      <<: *backend-environment
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-00000000}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Admin}
      # Real deploys don't load demo data; set true only if you intentionally
      # want the mock dataset in this environment.
      LOAD_MOCK_DATA: ${LOAD_MOCK_DATA:-false}
      MOCK_USER_PASSWORD: ${MOCK_USER_PASSWORD:-}
    networks:
      - app-network
    restart: "no"

  backend:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      <<: *backend-environment
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/prod/backend/.env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RECOGNITION_SERVICE_URL: ${RECOGNITION_SERVICE_URL:-http://recognition-service:8000}
      # Optional -- email stays disabled (EmailService no-ops) if these are
      # left blank. Set both SMTP_USER and SMTP_APP_PASSWORD to enable.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Advantech Asset Reservation}
      # Only required once an admin saves an App Password through
      # Administration > Notification instead of only via SMTP_* above.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # Optional -- Google Sign-In / mandatory account linking stays
      # disabled (no gate, "Continue with Google" link not functional)
      # unless all three GOOGLE_* are set. See docs/oauth-setup.md for
      # the Cloud Console setup.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Optional -- Microsoft/Outlook Sign-In, independently configurable
      # from GOOGLE_* above. MICROSOFT_TENANT_ID defaults to "common" if
      # unset. See docs/oauth-setup.md for the Azure App Registration setup.
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      REQUIRE_ACCOUNT_LINK: ${REQUIRE_ACCOUNT_LINK:-}
    depends_on:
      schema:
        condition: service_completed_successfully
    ports:
      # Direct development access for Swagger UI and API diagnostics.
      # Production can omit this mapping and expose only the Nginx entrypoint.
      - "${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/auth/me').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    restart: unless-stopped
    networks:
      - app-network

volumes:
  uploads-data:
    name: ${UPLOADS_VOLUME_NAME:-asset-reservation-uploads-data}

networks:
  app-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-asset-reservation-network}
