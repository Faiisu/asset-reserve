name: asset-reservation-frontend

services:
  frontend:
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network
    init: true
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-asset-reservation-network}
