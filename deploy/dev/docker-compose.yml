name: asset-reservation-dev

# Dev deploy: rebuilds every image from the current source tree on every
# `up --build`, so it always reflects whatever is on disk. Not meant to
# preserve data across resets -- use `db:seed`/`db:reset` (the `tools`
# profile services below) to (re)populate it.

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-asset_reservation}:${POSTGRES_PASSWORD:-dev-password}@postgres:5432/${POSTGRES_DB:-asset_reservation_dev}?schema=public
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}

services:
  postgres:
    image: postgres:17-alpine
    container_name: asset-reservation-dev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_reservation_dev}
      POSTGRES_USER: ${POSTGRES_USER:-asset_reservation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # Runs `prisma migrate deploy` + the demo-data seed. Re-run on every
  # `up --build` -- the seed upserts, it never truncates, so this is safe
  # against an existing dev database.
  schema:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: schema
    container_name: asset-reservation-dev-schema
    environment:
      <<: *db-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-00000000}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Admin}
      LOAD_MOCK_DATA: ${LOAD_MOCK_DATA:-true}
      MOCK_USER_PASSWORD: ${MOCK_USER_PASSWORD:-password123456}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  # `docker compose --profile tools run --rm seed` -- re-run the demo-data
  # seed on its own, without rebuilding/restarting anything else.
  seed:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: schema
    environment:
      <<: *db-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-00000000}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Admin}
      LOAD_MOCK_DATA: ${LOAD_MOCK_DATA:-true}
      MOCK_USER_PASSWORD: ${MOCK_USER_PASSWORD:-password123456}
    command: ["sh", "-c", "npm run seed"]
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    profiles: ["tools"]
    restart: "no"

  # `docker compose --profile tools run --rm reset` -- DESTRUCTIVE. Truncates
  # every table, wipes uploaded asset images, and re-seeds only the admin
  # user. Dev-only, never wired into the default `up`.
  reset:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: schema
    environment:
      <<: *db-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-00000000}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Admin}
    command: ["sh", "-c", "npm run reset:admin"]
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    profiles: ["tools"]
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: asset-reservation-dev-backend
    environment:
      <<: *db-env
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-must-be-at-least-32-characters-long}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-28800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18080,http://localhost:13000,http://127.0.0.1:18080,http://127.0.0.1:13000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RECOGNITION_SERVICE_URL: ${RECOGNITION_SERVICE_URL:-http://host.docker.internal:8000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Advantech Asset Reservation}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:18080}
      REQUIRE_ACCOUNT_LINK: ${REQUIRE_ACCOUNT_LINK:-false}
    depends_on:
      postgres:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-13000}:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/auth/me').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: runtime
    container_name: asset-reservation-dev-frontend
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-asset-reservation-dev-postgres-data}
  uploads-data:
    name: ${UPLOADS_VOLUME_NAME:-asset-reservation-dev-uploads-data}

networks:
  app-network:
    name: ${DOCKER_NETWORK_NAME:-asset-reservation-dev-network}
